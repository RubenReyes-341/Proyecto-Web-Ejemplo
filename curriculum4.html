  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    document.querySelectorAll(".toggle").forEach(toggle => {
      toggle.addEventListener("click", function () {
        const targetId = this.dataset.target;
        const imagen = document.getElementById(targetId);
        const bloque = imagen.closest('.bloque');
        const activa = imagen.classList.contains("activa");

        imagen.classList.toggle("activa");
        bloque.classList.toggle("activa");  // Añadimos clase al bloque para controlar su expansión

        this.textContent = activa
          ? this.textContent.replace("Ocultar", "Mostrar")
          : this.textContent.replace("Mostrar", "Ocultar");
      });
    });

    // Inicializar AOS después de cargar el script
    document.addEventListener("DOMContentLoaded", function() {
      AOS.init({
        duration: 1000, // Duración de la animación en milisegundos
        once: true      // Las animaciones se ejecutan solo una vez
      });
    });
  </script>
